services:
  - type: web
    name: aproveitamento-ifsistem
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_CPF
        sync: false
      - key: ADMIN_SENHA
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: DEMO_SEED
        value: "false"
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=75
      - key: PORTAL_URL
        sync: false
