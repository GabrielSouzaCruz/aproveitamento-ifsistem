services:
  - type: web
    name: aproveitamento-ifsistem
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: AUTH_ISSUER
        value: https://ifsistem-auth.onrender.com
      - key: DEMO_SEED
        value: "false"
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=75
      - key: PORTAL_URL
        sync: false
