spring.application.name=ifsystem
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ifsystem}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.servlet.multipart.resolve-lazily=true
springdoc.swagger-ui.path=/swagger-ui.html
app.demo-seed=${DEMO_SEED:false}
app.admin.cpf=${ADMIN_CPF:}
app.admin.senha=${ADMIN_SENHA:}
app.admin.email=${ADMIN_EMAIL:secretaria@ifsuldeminas.edu.br}

spring.flyway.enabled=true

# IA do parecer de equivalencia: fake (heuristica local) | gemini
ia.provedor=${IA_PROVEDOR:fake}
ia.gemini.api-key=${GEMINI_API_KEY:}
ia.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
