spring.application.name=ifsystem
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ifsystem}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Login unico: o JWT vem do ifsistem-auth (assinatura RS256 e emissor conferidos)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER:https://ifsistem-auth.onrender.com}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.servlet.multipart.resolve-lazily=true
springdoc.swagger-ui.path=/swagger-ui.html
app.demo-seed=${DEMO_SEED:false}

spring.flyway.enabled=true

# IA do parecer de equivalencia: fake (heuristica local) | gemini
ia.provedor=${IA_PROVEDOR:fake}
ia.gemini.api-key=${GEMINI_API_KEY:}
ia.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

# URL do portal externo (link "Portal IFSISTEM"); "#" = sem link
portal.url=${PORTAL_URL:#}
