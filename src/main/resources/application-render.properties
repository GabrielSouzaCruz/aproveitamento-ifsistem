# Profile de deploy no Render (Postgres externo, ex.: Supabase).
server.port=${PORT:8080}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
# Session pooler do Supabase: limite de 15 conexoes somado entre todos os servicos.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=600000
spring.h2.console.enabled=false
spring.flyway.enabled=true
# Seed demo desligado por padrao em producao; DEMO_SEED=true liga.
app.demo-seed=${DEMO_SEED:false}
